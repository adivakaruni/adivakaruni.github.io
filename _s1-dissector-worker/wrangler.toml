# Cloudflare Worker that relays EDGAR requests for the S-1 Dissector page.
# Deployed automatically by .github/workflows/deploy-s1-dissector-worker.yml
name = "s1-dissector-edgar"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
# Restrict which sites may use the relay. Replace with your GitHub Pages origin, e.g.
# ALLOWED_ORIGINS = "https://yourname.github.io,http://localhost:8000"
ALLOWED_ORIGINS = "*"

# SEC_USER_AGENT is set as a secret by the GitHub workflow (so your email stays out of
# this public repo). For a manual deploy run:  npx wrangler secret put SEC_USER_AGENT
